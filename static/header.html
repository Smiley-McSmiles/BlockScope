<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark light">
	<link rel="stylesheet" href="/style.css">
	<script>
		(function () {
			try {
				if (localStorage.getItem('theme') === 'light') {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			} catch (e) {}
		})();
	</script>
	<link rel="icon" href="/logo.svg" type="image/svg+xml">
	<title>BlockScope</title>
</head>

<body>
	<div class="container">

		<header class="topbar">
			<a href="/" class="brand">
				<img class="brand-mark" src="/logo.svg" width="40" height="40" alt="">
				<span class="brand-text">
					<span class="brand-name">Block<span class="accent">Scope</span></span>
					<span class="brand-tag">Your node, Your ledger, No middlemen</span>
				</span>
			</a>
			<div class="topbar-actions">
				<form action="/search" method="get" class="search-form">
					<div class="search-field">
						<input id="search" class="search" type="text" name="q" placeholder="Search transaction or block" autocomplete="off" spellcheck="false">
						<kbd class="kbd">/</kbd>
					</div>
					<button class="btn" type="submit">Search</button>
				</form>
				<button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light and dark mode" title="Toggle light / dark mode">
					<span class="ico-sun">☀</span><span class="ico-moon">☾</span>
				</button>
			</div>
		</header>
