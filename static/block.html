<section class="page-head fade">
	<div>
		<span class="eyebrow">Block</span>
		<h1 class="page-title">Block <span class="mono accent" id="blocknum">$blocknum</span></h1>
	</div>
</section>

<section class="card kv fade">
	<div class="row">
		<span class="k">Block hash</span>
		<span class="v">
			<span class="mono" id="hash">$hash</span>
			<button class="btn-ghost" type="button" data-copy="hash">Copy</button>
		</span>
	</div>
	<div class="row">
		<span class="k">Transactions</span>
		<span class="v">$numtxes</span>
	</div>
	<div class="row">
		<span class="k">Date and time</span>
		<span class="v">$timestamp</span>
	</div>
	<div class="row">
		<span class="k">Size</span>
		<span class="v">$size kB</span>
	</div>
	<div class="row">
		<span class="k">Difficulty</span>
		<span class="v">$diff M</span>
	</div>
	<div class="row">
		<span class="k">Reward</span>
		<span class="v">$reward XMR</span>
	</div>
	<div class="row">
		<span class="k">Coinbase tx</span>
		<span class="v"><a class="mono" href="/tx?id=$minerTx">$minerTx</a></span>
	</div>
</section>

<section class="card fade">
	<div class="card-head">
		<h2>Transactions in this block</h2>
	</div>
	<div class="table-wrap">
		<table class="listTable">
			<tr class="tr">
				<th>#</th>
				<th>Transaction</th>
			</tr>$txList
		</table>
	</div>
</section>
